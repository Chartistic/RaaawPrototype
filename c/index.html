document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ton type=\"submit\" style=\"min-height:52px;border:0;border-radius:12px;background:#0B0B0A;color:#FCFCFA;font-size:15px\">anfordern<\u002Fbutton>\n      <\u002Fform>\n      <p style=\"margin:20px 0 0;font-size:13px;line-height:1.6;color:rgba(11,11,10,0.6)\">direkter draht — leon vargin, vertrieb handel<br>b2b@raaaw.com<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"height:80px\"><\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<footer style=\"border-top:1px solid #E7E7E0;padding:36px 20px 28px;max-width:1240px;margin:0 auto\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px\">\n    <sc-for list=\"{{ footer }}\" as=\"col\" hint-placeholder-count=\"4\">\n      <div>\n        <p style=\"margin:0 0 12px;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:rgba(11,11,10,0.4)\">{{ col.h }}<\u002Fp>\n        <ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px\">\n          <sc-for list=\"{{ col.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <li>{{ it }}<\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <p style=\"margin:34px 0 0;font-weight:200;font-size:clamp(3.4rem,20vw,7rem);line-height:0.85;letter-spacing:-0.05em\">raaaw<\u002Fp>\n  <p style=\"margin:20px 0 0;font-size:12px;line-height:1.6;color:rgba(11,11,10,0.45)\">honest water gmbh · salvatorplatz 3, 80333 münchen<br>impressum · datenschutz · agb · design-prototyp — preise und rechtstexte sind platzhalter<\u002Fp>\n<\u002Ffooter>\n\n<sc-if value=\"{{ isShop }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(252,252,250,0.9);backdrop-filter:blur(16px);border-top:1px solid #E7E7E0\">\n    <div style=\"display:flex;align-items:center;gap:12px;max-width:1240px;margin:0 auto\">\n      <div style=\"flex:1;min-width:0\">\n        <p style=\"margin:0;font-size:14px;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ barTitle }}<\u002Fp>\n        <p style=\"margin:2px 0 0;font-size:12px;color:rgba(11,11,10,0.5)\">{{ barSub }}<\u002Fp>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ addBar }}\" style=\"flex:none;min-height:48px;padding:0 22px;border:0;border-radius:999px;background:#0B0B0A;color:#FCFCFA;font-size:15px\">in den warenkorb<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:70;padding:12px 20px;border-radius:999px;background:#0B0B0A;color:#FCFCFA;font-size:14px;white-space:nowrap;box-shadow:0 12px 30px rgba(11,11,10,0.25)\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932},&quot;startView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;shop&quot;,&quot;betriebe&quot;],&quot;default&quot;:&quot;shop&quot;,&quot;tsType&quot;:&quot;'shop'|'betriebe'&quot;},&quot;heroFlavor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;zitrone&quot;,&quot;grapefruit&quot;,&quot;himbeere&quot;,&quot;limette&quot;],&quot;default&quot;:&quot;zitrone&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst SORTS = [\n  {k:'zitrone', name:'zitrone', color:'#F2DC4E', grad:'linear-gradient(180deg,#F3F19A 0%,#F2C21E 100%)', tile:'linear-gradient(180deg,#F8F6C8 0%,#F2DC4E 100%)', can:'assets/can/zitrone.webp', available:true,\n   short:'zitrusöl aus der schale, kaum säurespitze. die sorte, mit der die meisten anfangen.',\n   ing:['mineralwasser','3 % bio-zitronendirektsaft','bio-zitronenextrakt','kohlensäure']},\n  {k:'grapefruit', name:'pink grapefruit', color:'#F0908C', grad:'linear-gradient(180deg,#FBC9C6 0%,#E5484E 100%)', tile:'linear-gradient(180deg,#FDE0DE 0%,#F0908C 100%)', can:'assets/can/grapefruit.webp', available:true,\n   short:'7 % direktsaft, herb. die rosa farbe kommt von bio-hibiskus, nicht aus der farbdose.',\n   ing:['mineralwasser','7 % bio-grapefruitdirektsaft','bio-grapefruitextrakt','bio-hibiskusextrakt','kohlensäure']},\n  {k:'himbeere', name:'himbeer-limette', color:'#E4536E', grad:'linear-gradient(180deg,#CFE68C 0%,#E03B62 100%)', tile:'linear-gradient(180deg,#E6F2BE 0%,#E4536E 100%)', can:'assets/can/himbeere.webp', available:true,\n   short:'himbeere als püree, nicht als konzentrat — deshalb naturtrüb. limette gibt die säure dazu.',\n   ing:['mineralwasser','3 % bio-himbeerpüree','1 % bio-limettendirektsaft','kohlensäure']},\n  {k:'limette', name:'limette', color:'#B7D63C', grad:'linear-gradient(180deg,#E0EF9B 0%,#93C42B 100%)', tile:'linear-gradient(180deg,#EFF7D2 0%,#B7D63C 100%)', can:'', available:false,\n   short:'3 % direktsaft aus brasilien, schonend gepresst. kommt als vierte sorte dazu.',\n   ing:['mineralwasser','3 % bio-limettendirektsaft','bio-limettenextrakt','kohlensäure']}\n];\n\nconst PACKS = [\n  {k:'probier', title:'probierpaket', sub:'jede sorte einmal, sechs dosen', price:14.90, unit:'2,48 € je dose', tag:false},\n  {k:'tray24', title:'24 dosen', sub:'ein tray, eine sorte oder gemischt', price:53.76, unit:'2,24 € je dose', tag:true},\n  {k:'tray48', title:'48 dosen', sub:'zwei trays, 10 % günstiger', price:96.77, unit:'2,02 € je dose', tag:false}\n];\n\nconst FAQ = [\n  {q:'ist das für kinder geeignet?', a:'ab dem schulalter ja. drin sind mineralwasser, bio-direktsaft, zestenextrakt und kohlensäure — kein zugesetzter zucker, keine süßstoffe, keine aromen und kein koffein. für babys und kleinkinder ist raaaw nicht gedacht: säurehaltige getränke gehören nicht in diese altersgruppe.'},\n  {q:'schmeckt das nach nichts, wenn kein zucker drin ist?', a:'es schmeckt nach weniger, das stimmt — und genau darum geht es. der erste schluck irritiert viele, weil man süße erwartet. nach der zweiten dose schmeckt herkömmliche limonade oft zu süß. deshalb empfehlen wir das probierpaket statt einer einzelnen dose.'},\n  {q:'warum steht bei „kalorienfrei\" ein sternchen?', a:'weil der begriff gesetzlich definiert ist und sich auf 100 ml bezieht, nicht auf die dose: kalorienfrei heißt höchstens 4 kcal je 100 ml. raaaw liegt bei 1 bis 3 kcal je 100 ml und erfüllt das.'},\n  {q:'was ist mit pfand und versand?', a:'0,25 € pfand je dose, wie bei jeder einwegdose in deutschland. versand innerhalb deutschlands ist kostenlos, lieferung in 1 bis 4 tagen.'},\n  {q:'kann ich das abo pausieren?', a:'ja, jederzeit und ohne frist. du wählst den rhythmus und kannst jede lieferung verschieben, ändern oder das abo beenden. im abo sparst du 5 %.'}\n];\n\nclass Component extends DCLogic {\n  state = {\n    view: this.props.startView || 'shop',\n    sort: this.props.heroFlavor || 'zitrone',\n    cart: 0, abo: false, tableOpen: false, faq: -1, toast: ''\n  };\n\n  s() { return SORTS.find(x => x.k === this.state.sort) || SORTS[0]; }\n\n  money(n) { return n.toFixed(2).replace('.', ',') + ' €'; }\n\n  flash(msg) {\n    clearTimeout(this._t);\n    this.setState({ toast: msg, cart: this.state.cart + 1 });\n    this._t = setTimeout(() => this.setState({ toast: '' }), 2200);\n  }\n\n  pillStyle(active, color) {\n    return 'flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font-size:14px;letter-spacing:-0.01em;white-space:nowrap;background:' +\n      (active ? '#0B0B0A' : '#FFFFFF') + ';color:' + (active ? '#FCFCFA' : '#0B0B0A') +\n      ';border:1px solid ' + (active ? '#0B0B0A' : '#DEDED6');\n  }\n\n  tab(active) {\n    return 'min-height:34px;padding:0 16px;border:0;border-radius:999px;font-size:14px;letter-spacing:-0.01em;background:' +\n      (active ? '#0B0B0A' : 'transparent') + ';color:' + (active ? '#FCFCFA' : 'rgba(11,11,10,0.55)');\n  }\n\n  renderVals() {\n    const s = this.s();\n    const abo = this.state.abo;\n    const f = abo ? 0.95 : 1;\n\n    const sorts = SORTS.map(x => ({\n      k: x.k, name: x.name, short: x.short, canAlt: 'raaaw ' + x.name,\n      available: x.available, soon: !x.available,\n      tile: 'position:relative;display:flex;align-items:flex-end;justify-content:center;height:210px;padding-top:18px;background:' + x.tile,\n      canStyle: 'height:186px;width:101px;background-image:url(\"' + x.can + '\");background-size:contain;background-repeat:no-repeat;background-position:bottom center;filter:drop-shadow(0 14px 20px rgba(11,11,10,0.18))',\n      pill: this.pillStyle(this.state.sort === x.k, x.color),\n      dot: 'width:12px;height:12px;border-radius:50%;background:' + x.color + ';flex:none',\n      cta: x.available\n        ? 'width:100%;min-height:48px;border:1px solid #0B0B0A;border-radius:999px;background:#FCFCFA;font-size:15px'\n        : 'width:100%;min-height:48px;border:1px solid #E7E7E0;border-radius:999px;background:#F3F3EE;color:rgba(11,11,10,0.4);font-size:15px;cursor:default',\n      ctaLabel: x.available ? 'tray · 53,76 €' : 'bald verfügbar',\n      pick: () => this.setState({ sort: x.k }),\n      add: () => x.available && this.flash('24er tray ' + x.name + ' hinzugefügt')\n    }));\n\n    const packs = PACKS.map(p => ({\n      title: p.title, sub: p.sub,\n      price: this.money(p.price * f), unit: p.unit,\n      card: 'display:flex;flex-direction:column;padding:22px;border-radius:20px;border:1px solid ' + (p.k === 'probier' ? '#0B0B0A' : '#E7E7E0') + ';background:' + (p.k === 'probier' ? '#F3F3EE' : '#FCFCFA'),\n      tag: p.tag ? 'font-size:11px;letter-spacing:0.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:#F2DC4E;white-space:nowrap' : 'display:none',\n      cta: 'margin-top:20px;width:100%;min-height:50px;border-radius:999px;font-size:15px;border:' + (p.k === 'probier' ? '0' : '1px solid #0B0B0A') + ';background:' + (p.k === 'probier' ? '#0B0B0A' : 'transparent') + ';color:' + (p.k === 'probier' ? '#FCFCFA' : '#0B0B0A'),\n      add: () => this.flash(p.title + ' hinzugefügt')\n    }));\n\n    return {\n      isShop: this.state.view === 'shop',\n      isB2B: this.state.view === 'betriebe',\n      goShop: () => this.setState({ view: 'shop' }),\n      goB2B: () => this.setState({ view: 'betriebe' }),\n      tabShop: this.tab(this.state.view === 'shop'),\n      tabB2B: this.tab(this.state.view === 'betriebe'),\n      cart: this.state.cart,\n      openCart: () => this.flash(this.state.cart ? 'warenkorb: ' + this.state.cart + ' artikel' : 'warenkorb ist leer'),\n      noop: (e) => { e && e.preventDefault && e.preventDefault(); this.flash('prototyp — kein echter versand'); },\n\n      heroGrad: s.grad,\n      canBg: 'url(\"' + (s.can || 'assets/can/zitrone.webp') + '\")',\n      canAlt: 'raaaw ' + s.name,\n      sorts,\n      ing: s.ing.map((t, i) => ({ n: String(i + 1).padStart(2, '0'), t })),\n      addTrial: () => this.flash('probierpaket hinzugefügt'),\n\n      tableOpen: this.state.tableOpen,\n      tableLabel: (this.state.tableOpen ? '– ' : '+ ') + 'die vollständige tabelle',\n      toggleTable: () => this.setState({ tableOpen: !this.state.tableOpen }),\n      tableRows: [\n        {k:'zucker', a:'18–24 g', b:'0,3 g'},\n        {k:'kalorien', a:'ca. 75–100 kcal', b:'3 kcal'},\n        {k:'süßstoffe', a:'häufig', b:'keine'},\n        {k:'künstliche aromen', a:'häufig', b:'keine'},\n        {k:'konzentrat', a:'häufig', b:'keins'},\n        {k:'zutaten insgesamt', a:'8–12', b:'4'}\n      ],\n\n      packs,\n      tabOnce: this.tab(!abo),\n      tabAbo: this.tab(abo),\n      setOnce: () => this.setState({ abo: false }),\n      setAbo: () => this.setState({ abo: true }),\n\n      origins: [\n        {img:'assets/img/15.webp', alt:'zitronenbaum mit leiter in sizilien', hasImg:true, isPh:false, phLabel:'', title:'bio-zitrone', place:'siracusa, sizilien', body:'von hand gepflückt, innerhalb weniger stunden gepresst. samt zestenöl aus der schale.'},\n        {img:'assets/img/16.webp', alt:'aufgeschnittene bio-grapefruits', hasImg:true, isPh:false, phLabel:'', title:'bio-pink-grapefruit', place:'sizilien', body:'7 % direktsaft, kein konzentrat. die rosa farbe kommt von bio-hibiskus, nicht aus der farbdose.'},\n        {img:'', alt:'', hasImg:false, isPh:true, phLabel:'foto folgt — himbeeranbau serbien', title:'bio-himbeere & limette', place:'himbeeren serbien · limetten brasilien', body:'himbeere als püree, nicht als saftkonzentrat — deshalb bleibt sie naturtrüb. limette gibt die säure dazu.'},\n        {img:'', alt:'', hasImg:false, isPh:true, phLabel:'foto folgt — limettenanbau brasilien', title:'bio-limette', place:'brasilien', body:'3 % direktsaft, schonend gepresst. kommt als vierte sorte dazu.'}\n      ],\n\n      reviews: [\n        {t:'das gesündeste getränk, was ich finden konnte. keine kalorien, kein zucker, einfach nur natur. das beste ist: die kinder lieben es als highlight.', n:'michael brehm'},\n        {t:'super lecker!! so erfrischend. freue mich über neue geschmacksrichtungen.', n:'veronika müller'},\n        {t:'erfrischend, besonders wenn es kühl gelagert wurde. unfassbar lecker.', n:'anonym'}\n      ],\n\n      clips: [\n        {img:'assets/img/06.webp', alt:'passantin am viktualienmarkt', cap:'auf der straße gefragt. antwort ohne skript.'},\n        {img:'assets/img/08.webp', alt:'frau mit hund am odeonsplatz', cap:'zwischen zwei terminen, mit hund.'},\n        {img:'assets/img/09.webp', alt:'drei freundinnen in der innenstadt', cap:'drei freundinnen, eine frage.'},\n        {img:'assets/img/11.webp', alt:'zwei frauen am viktualienmarkt', cap:'samstag am markt, spontan gefragt.'},\n        {img:'assets/img/12.webp', alt:'andi, coach im basement münchen', cap:'andi, coach im basement münchen.'}\n      ],\n\n      faq: FAQ.map((x, i) => ({\n        q: x.q, a: x.a, open: this.state.faq === i,\n        icon: 'font-size:20px;font-weight:200;transform:rotate(' + (this.state.faq === i ? '45deg' : '0deg') + ');transition:transform .2s;color:rgba(11,11,10,0.45)',\n        toggle: () => this.setState({ faq: this.state.faq === i ? -1 : i })\n      })),\n\n      press: [\n        {img:'assets/img/00.webp', alt:'vogue'}, {img:'assets/img/01.webp', alt:'gala'},\n        {img:'assets/img/02.webp', alt:'elle'}, {img:'assets/img/03.webp', alt:'dld'},\n        {img:'assets/img/04.webp', alt:'liz & lou'}, {img:'assets/img/18.webp', alt:'käfer'},\n        {img:'assets/img/19.webp', alt:'mandarin oriental'}, {img:'assets/img/25.webp', alt:'the basement'}\n      ],\n\n      kpis: [\n        {v:'+85 %', l:'wachstum im letzten jahr'},\n        {v:'250+', l:'point-of-sale in deutschland'},\n        {v:'3 von 4', l:'kund:innen kaufen erneut'},\n        {v:'3 trays', l:'mindestbestellmenge, sortenrein'}\n      ],\n      skus: [\n        {n:'raaaw bio-zitrone', c:'0,33 l', t:'24', e:'4262531110092'},\n        {n:'raaaw bio pink grapefruit', c:'0,33 l', t:'24', e:'4262531110221'},\n        {n:'raaaw bio himbeere-limette', c:'0,33 l', t:'24', e:'4262531110030'}\n      ],\n      steps: [\n        {n:'01', t:'muster', b:'wir schicken je sorte eine dose plus produktblatt. kostenlos.'},\n        {n:'02', t:'konditionen', b:'ein telefonat, danach steht der bestellschein.'},\n        {n:'03', t:'erstlieferung', b:'frei haus, mit dem material fürs regal.'},\n        {n:'04', t:'nachbestellung', b:'ab einem tray, feste liefertage nach absprache.'}\n      ],\n      pos: [\n        {img:'assets/img/40.webp', alt:'gefüllter kühlschrank mit raaaw-dosen', t:'kühlschrank', s:'glastür, beklebt nach maß · ab 10 trays',\n         hasImg:true, isPh:false, phLabel:'', media:'position:relative;border-radius:14px;overflow:hidden;background:#F3F3EE'},\n        {img:'assets/img/41.webp', alt:'raaaw im kühlregal', t:'kühlregal', s:'schieber und theken-ticker',\n         hasImg:true, isPh:false, phLabel:'', media:'position:relative;border-radius:14px;overflow:hidden;background:#F3F3EE'},\n        {img:'', alt:'', t:'aufsteller', s:'din a5, doppelseitig für theke und kasse', hasImg:false, isPh:true, phLabel:'foto folgt — aufsteller',\n         media:'position:relative;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(135deg,#F3F3EE 0 10px,#EDEDE6 10px 20px);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center'},\n        {img:'', alt:'', t:'weiße kisten', s:'stapelbar, gebrandet — transport und display in einem', hasImg:false, isPh:true, phLabel:'foto folgt — kisten',\n         media:'position:relative;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(135deg,#F3F3EE 0 10px,#EDEDE6 10px 20px);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center'},\n        {img:'', alt:'', t:'schaufenster', s:'kleber, rund, 30 cm — innen aufgeklebt, von außen lesbar', hasImg:false, isPh:true, phLabel:'foto folgt — schaufenster',\n         media:'position:relative;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(135deg,#F3F3EE 0 10px,#EDEDE6 10px 20px);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center'},\n        {img:'', alt:'', t:'24er tray als display', s:'oberseite abreißen, hinstellen, fertig', hasImg:false, isPh:true, phLabel:'foto folgt — tray-display',\n         media:'position:relative;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(135deg,#F3F3EE 0 10px,#EDEDE6 10px 20px);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center'}\n      ],\n\n      footer: [\n        {h:'sorten', items:['zitrone','pink grapefruit','himbeer-limette','limette — bald']},\n        {h:'transparenz', items:['zutaten & nährwerte','herkunft','bio-zertifizierung','pfand & recycling']},\n        {h:'marke', items:['unsere zutaten','woher wir liefern','nachhaltigkeit','presse']},\n        {h:'service', items:['versand','rückgabe','kontakt','@drinkraaaw']}\n      ],\n\n      barTitle: this.state.abo ? 'probierpaket im abo' : 'probierpaket · alle sorten',\n      barSub: this.money(14.90 * f) + ' · versandkostenfrei',\n      addBar: () => this.flash('probierpaket hinzugefügt'),\n      toast: this.state.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
